name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'schema/**'
      - 'functions/**'
  # Also deploy when faction data is updated by the faction workflow
  workflow_run:
    workflows: ["Faction Data Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Skip if triggered by failed faction workflow
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Generate sitemap
        working-directory: web
        run: npm run generate-sitemap

      # Monitoring is configured entirely through these variables. Any that are
      # unset simply disable their feature: no DSN means Sentry never
      # initialises, no beacon token means the analytics script is not injected,
      # and no Sentry auth token means sourcemaps are neither built nor
      # uploaded. That keeps forks and PR builds from reporting into this
      # project.
      #
      # VITE_SENTRY_DSN and VITE_CF_BEACON_TOKEN are public values (they ship in
      # the client bundle); they are stored as secrets only so forks don't
      # inherit them. SENTRY_AUTH_TOKEN is a real secret and is build-time only.
      - name: Build
        working-directory: web
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          # Optional dial: set the repository variable to turn tracing down
          # (or to 0) during a quota crunch without a code change. Unset falls
          # back to the 0.1 default in monitoring.ts.
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          VITE_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
          VITE_APP_VERSION: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Required for EU-region Sentry orgs (https://de.sentry.io).
          # Leave unset for US orgs; the plugin defaults to https://sentry.io.
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: npm run build

      # Sourcemaps are uploaded to Sentry during the build and then deleted from
      # dist. A failed upload leaves them behind, and Pages would serve them —
      # publishing our unminified source. Strip them here rather than failing:
      # a Sentry outage should cost readable stack traces, not the deploy.
      - name: Strip sourcemaps from build output
        working-directory: web
        run: |
          set -euo pipefail
          if find dist -name '*.map' -print -quit | grep -q .; then
            echo "::warning::Sourcemaps left in dist (upload likely failed). Removing before deploy."
            find dist -name '*.map' -print -delete
          else
            echo "No sourcemaps in dist."
          fi

      # Download faction data from GitHub Releases and include in dist
      # This serves faction zips from the same origin, avoiding CORS issues
      - name: Download faction data from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/dist/factions

          # Download all assets from the faction-data release
          echo "Downloading faction data from release..."
          gh release download faction-data --dir web/dist/factions --pattern "*.zip" --pattern "manifest.json" || {
            echo "Warning: Could not download faction data from release"
            echo "This is expected if the faction-data release doesn't exist yet"
          }

          # List what was downloaded
          echo "Faction data downloaded:"
          ls -la web/dist/factions/ || echo "No faction data found"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=pa-pedia

      # The Cloudflare zone edge-caches index.html for hours (cf-cache-status
      # HIT), so a JS-hash-changing deploy strands users on the previous chunk
      # graph — blank page or "Failed to fetch dynamically imported module" —
      # until someone manually purges. Purge after every deploy so the edge
      # serves the freshly-deployed index.html immediately. Hashed /assets/* are
      # immutable, so purging everything is safe (they just re-fetch).
      #
      # Requires: CLOUDFLARE_ZONE_ID secret + the API token having
      # "Zone → Cache Purge → Purge" permission on this zone.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID not set — skipping cache purge."
            echo "Add the zone ID secret (and give the API token Cache Purge scope)"
            echo "so deploys stop stranding users on stale HTML."
            exit 0
          fi
          echo "Purging Cloudflare cache for zone ${CLOUDFLARE_ZONE_ID}..."
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare cache purge failed. Check that the API token has"
            echo "'Zone → Cache Purge → Purge' permission and CLOUDFLARE_ZONE_ID is correct."
            exit 1
          fi
          echo "Cache purged."
